<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PotholeIQ{% endblock %} · PotholeIQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1f33'/><ellipse cx='50' cy='56' rx='30' ry='17' fill='%2314b8a6'/><ellipse cx='50' cy='52' rx='20' ry='10' fill='%230b1f33'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head><body>
<header class="nav"><a class="brand" href="/"><span class="logo"></span>Pothole<b>IQ</b></a>
<nav>{% set p = request.path %}
<a href="/" class="{{ 'on' if p=='/' }}">Live map</a>
<a href="/report" class="{{ 'on' if p=='/report' }}">Report</a>
<a href="/dashboard" class="{{ 'on' if p=='/dashboard' }}">Repair queue</a>
<a href="/how-it-works" class="{{ 'on' if p=='/how-it-works' }}">How it works</a></nav></header>
<main>{% block content %}{% endblock %}</main>
<div id="toast" class="toast" role="status"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
